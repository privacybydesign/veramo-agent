name: Delivery

# Publishes container images to GitHub Container Registry (ghcr.io).
#
# Three flows:
#   1. Push / merge to main          -> :edge (+ :sha-<commit>)
#   2. Manual dispatch, no version   -> :edge + :<branch> (+ :sha-<commit>)
#                                       (pick the branch in the "Run workflow"
#                                        dropdown, e.g. a PR branch)
#   3. GitHub release published      -> :<major>.<minor>.<patch> + :<major>.<minor>
#      OR manual dispatch w/ version -> the entered version (v* or pbdf-v*)
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0 or pbdf-v1.0.0). Leave empty to build an :edge image from the branch selected above.'
        required: false
        type: string

concurrency:
  group: delivery-${{ github.ref }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual version build -> check out that tag/ref; otherwise the triggering ref.
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # 1. Push / merge to main -> edge
            type=edge,branch=main
            # 2. Manual dispatch without a version -> edge + branch name
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}
            # 3a. GitHub release -> semver tags derived from the git tag
            type=semver,pattern={{major}}.{{minor}}.{{patch}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            # 3b. Manual dispatch with a version -> that version (v* and pbdf-v* prefixes)
            type=match,pattern=v(.*),group=1,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=match,pattern=pbdf-v(.*),group=1,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            # Traceable commit tag on edge builds (push to main / dispatch without version)
            type=sha,enable=${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version == '') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
